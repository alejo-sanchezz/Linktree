<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{margin: 0;
    padding: 0;}

    div{
        background-color: violet;
        width: 100vw;
        height: 100vh;
        position: relative;
    }
    #img1 { 
        position: absolute;
        
    }
    #img2 {
        position: absolute;
        left: 50%;
        transform: translatex(-50%);
     }
    
    #img3 { position: absolute; 
        right: 0;}

    #img4 {position: absolute;
    top: 50%;
    transform: translateY(-50%); }

    #img5 {position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%); }

    #img6 {position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);}

    #img7 {position: absolute;
    bottom: 0;}

    #img8 {position: absolute;
    bottom: 0%;
    left: 50%;
    }

    #img9 {position: absolute;
    right: 0;
    bottom: 0;
}

</style>

<body> 

<div>
    <img src="Messi.jpg" alt="Foto messi" id="img1" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img2" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img3" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img4" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img5" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img6" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img7" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img8" width="200" height="200">
    <img src="Messi.jpg" alt="Foto messi" id="img9" width="200" height="200">

 </div>   
</body>
</html>
